apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordenes-service
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ordenes-service
    app.kubernetes.io/part-of: ecommerce-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ordenes-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ordenes-service
        app.kubernetes.io/part-of: ecommerce-k8s
    spec:
      containers:
        - name: ordenes-service
          image: ghcr.io/<OWNER>/ordenes-service:<TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: ORDENES_PORT
            - name: CATALOGO_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: CATALOGO_URL
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: POSTGRES_ORDENES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: POSTGRES_ORDENES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-ordenes-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db-ordenes:5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ordenes-service
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ordenes-service
    app.kubernetes.io/part-of: ecommerce-k8s
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ordenes-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
