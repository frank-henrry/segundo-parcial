apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-k8s
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/catalogo
            pathType: Prefix
            backend:
              service:
                name: catalogo-service
                port:
                  number: 8001
          - path: /api/ordenes
            pathType: Prefix
            backend:
              service:
                name: ordenes-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
