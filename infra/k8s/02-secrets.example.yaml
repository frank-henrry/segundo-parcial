# Plantilla de ejemplo únicamente. NO versionar credenciales reales en Git.
# Para crear los Secrets reales en el clúster, usa `kubectl create secret` (ver infra/k8s/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: db-catalogo-secret
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-k8s
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<CAMBIAR_PASSWORD_CATALOGO>"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-ordenes-secret
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-k8s
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<CAMBIAR_PASSWORD_ORDENES>"
