apiVersion: v1
kind: ConfigMap
metadata:
  name: db-catalogo-init
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: db-catalogo
    app.kubernetes.io/part-of: ecommerce-k8s
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS productos (
        id SERIAL PRIMARY KEY,
        sku VARCHAR(40) UNIQUE NOT NULL,
        nombre VARCHAR(160) NOT NULL,
        categoria VARCHAR(80) NOT NULL,
        precio NUMERIC(12, 2) NOT NULL CHECK (precio > 0),
        stock INTEGER NOT NULL CHECK (stock >= 0),
        activo BOOLEAN NOT NULL DEFAULT TRUE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    INSERT INTO productos (sku, nombre, categoria, precio, stock, activo)
    VALUES
        ('SKU-1001', 'Teclado Mecánico RGB', 'Periféricos', 79.90, 25, TRUE),
        ('SKU-1002', 'Mouse Inalámbrico Pro', 'Periféricos', 49.90, 40, TRUE),
        ('SKU-1003', 'Monitor 27" QHD', 'Monitores', 299.00, 12, TRUE),
        ('SKU-1004', 'Audífonos Studio ANC', 'Audio', 129.50, 18, TRUE)
    ON CONFLICT (sku) DO NOTHING;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-catalogo
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: db-catalogo
    app.kubernetes.io/part-of: ecommerce-k8s
spec:
  serviceName: db-catalogo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-catalogo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-catalogo
        app.kubernetes.io/part-of: ecommerce-k8s
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: POSTGRES_CATALOGO_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: POSTGRES_CATALOGO_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-catalogo-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: db-catalogo-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-sql
          configMap:
            name: db-catalogo-init
  volumeClaimTemplates:
    - metadata:
        name: db-catalogo-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db-catalogo
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: db-catalogo
    app.kubernetes.io/part-of: ecommerce-k8s
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: db-catalogo
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
